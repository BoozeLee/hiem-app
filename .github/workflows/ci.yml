name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint 2>&1 | head -30 || true
      - run: npm run build 2>&1 | tail -10
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - run: cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tail -20
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings 2>&1 | head -30 || true
      - run: cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tail -20

