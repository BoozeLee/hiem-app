[package]
name = "hiem-app"
version = "0.1.0"
description = "HIEM — GitHub-authenticated chat with engineering agent"
authors = ["BoozeLee"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
url = "2.5"

# ── GitHub App JWT + credential store ──────────────────────────────────────
keyring = "3.6.2"
jsonwebtoken = { version = "9.3", features = ["use_pem"] }
base64 = "0.22"
rsa = { version = "0.9", features = ["pem", "sha2"] }
pkcs8 = "0.10"
chrono = { version = "0.4", features = ["serde", "std"] }

# ── LangSmith tracing (Rust) ─────────────────────────────────────────────────
langsmith-rust = "0.1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["std", "env-filter"] }

# ── Agent runtime ───────────────────────────────────────────────────────────
serde_yaml = "0.9"
async-trait = "0.1"
dashmap = "6.1"
bm25 = "2.3"
dirs = "5.0"
uuid = { version = "1.10", features = ["v4"] }
thiserror = "1.0"
serde_repr = "0.1"

[package.metadata.tauri]
bundle.resources = ["assets/**"]

